<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Vizzel Sales</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f2f2f7; color: #1c1c1e; -webkit-tap-highlight-color: transparent; }

    /* ── Splash ── */
    #splash { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 40px 20px; text-align: center; }
    .splash-icon  { font-size: 60px; margin-bottom: 18px; }
    .splash-title { font-size: 26px; font-weight: 700; margin-bottom: 6px; }
    .splash-sub   { color: #8e8e93; font-size: 14px; margin-bottom: 28px; line-height: 1.5; }
    .splash-spinner { width: 32px; height: 32px; border: 3px solid #e5e5ea; border-top-color: #06C755; border-radius: 50%; animation: spin 0.7s linear infinite; }
    .splash-err   { color: #FF3B30; font-size: 13px; margin-top: 14px; line-height: 1.4; }

    /* ── App ── */
    #app { display: none; flex-direction: column; height: 100vh; overflow: hidden; }
    .hdr { background: #06C755; color: white; padding: 11px 16px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .hdr img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: rgba(255,255,255,.25); }
    .hdr-info h1 { font-size: 15px; font-weight: 600; }
    .hdr-info p  { font-size: 11px; opacity: .85; }

    /* ── Tabs ── */
    .tabs { background: white; display: flex; border-bottom: 1px solid #e5e5ea; flex-shrink: 0; }
    .tab  { flex: 1; padding: 9px 2px; text-align: center; font-size: 12px; color: #8e8e93; border: none; background: none; cursor: pointer; font-weight: 500; font-family: inherit; position: relative; }
    .tab.on { color: #06C755; font-weight: 600; }
    .tab.on::after { content: ''; position: absolute; bottom: 0; left: 15%; right: 15%; height: 2px; background: #06C755; border-radius: 2px 2px 0 0; }

    /* ── Content ── */
    .content { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 14px; }
    .screen { display: none; }
    .screen.on { display: block; }

    /* ── Pipeline grid ── */
    .pipe-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 18px; }
    .pipe-card { background: white; border-radius: 10px; padding: 10px 6px; text-align: center; box-shadow: 0 1px 3px rgba(0,0,0,.07); border-top: 3px solid; cursor: pointer; transition: transform .12s; }
    .pipe-card:active { transform: scale(.96); }
    .pipe-card .cnt  { font-size: 26px; font-weight: 700; line-height: 1; }
    .pipe-card .lbl  { font-size: 10px; color: #8e8e93; margin-top: 4px; line-height: 1.2; }
    /* color groups */
    .cg-gray   { border-color: #8e8e93; } .cg-gray   .cnt { color: #8e8e93; }
    .cg-blue   { border-color: #007AFF; } .cg-blue   .cnt { color: #007AFF; }
    .cg-orange { border-color: #FF9500; } .cg-orange .cnt { color: #FF9500; }
    .cg-green  { border-color: #34C759; } .cg-green  .cnt { color: #34C759; }
    .cg-red    { border-color: #FF3B30; } .cg-red    .cnt { color: #FF3B30; }

    /* ── Section title ── */
    .sec { font-size: 11px; font-weight: 600; color: #8e8e93; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 7px; }

    /* ── Project list ── */
    .plist { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.07); }
    .prow  { padding: 12px 14px; border-bottom: 1px solid #f2f2f7; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: background .1s; }
    .prow:last-child { border-bottom: none; }
    .prow:active { background: #f5f5f5; }
    .prow-info { flex: 1; min-width: 0; }
    .prow-name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .prow-sub  { font-size: 12px; color: #8e8e93; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chev { color: #c7c7cc; font-size: 16px; flex-shrink: 0; }

    /* ── Badges ── */
    .bdg { display: inline-block; padding: 3px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; flex-shrink: 0; }
    .bg-gray   { background: #e5e5ea; color: #636366; }
    .bg-blue   { background: #dff0ff; color: #007AFF; }
    .bg-orange { background: #fff3e0; color: #FF9500; }
    .bg-green  { background: #e4f9ec; color: #34C759; }
    .bg-red    { background: #ffe5e5; color: #FF3B30; }

    /* ── Form ── */
    .fcard { background: white; border-radius: 12px; overflow: hidden; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.07); }
    .frow  { display: flex; align-items: center; padding: 0 14px; border-bottom: 1px solid #f2f2f7; }
    .frow:last-child { border-bottom: none; }
    .flbl  { font-size: 13px; color: #8e8e93; width: 80px; flex-shrink: 0; padding: 13px 0; }
    .finp  { flex: 1; border: none; outline: none; font-size: 15px; padding: 13px 0 13px 8px; color: #1c1c1e; background: transparent; width: 100%; font-family: inherit; }
    .finp::placeholder { color: #c7c7cc; }
    select.finp { appearance: none; -webkit-appearance: none; }

    /* ── Province searchable dropdown ── */
    #province-drop { position: fixed; background: white; border-radius: 12px; box-shadow: 0 6px 24px rgba(0,0,0,.18); max-height: 248px; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 600; display: none; }
    #province-drop.open { display: block; }
    .pdrop-item { padding: 13px 16px; font-size: 15px; cursor: pointer; border-bottom: 1px solid #f2f2f7; color: #1c1c1e; }
    .pdrop-item:last-child { border-bottom: none; }
    .pdrop-item:active { background: #f5f5f5; }
    .pdrop-item mark { background: #fef3c7; color: #1c1c1e; font-weight: 700; padding: 0 1px; border-radius: 2px; font-style: normal; }
    .pdrop-empty { padding: 16px; font-size: 14px; color: #8e8e93; text-align: center; }

    /* ── Detail ── */
    .dcard { background: white; border-radius: 12px; overflow: hidden; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.07); }
    .drow  { display: flex; padding: 12px 14px; border-bottom: 1px solid #f2f2f7; }
    .drow:last-child { border-bottom: none; }
    .dkey  { font-size: 13px; color: #8e8e93; width: 100px; flex-shrink: 0; }
    .dval  { flex: 1; font-size: 14px; word-break: break-word; }
    .dval a { color: #007AFF; text-decoration: none; }

    /* ── Document list ── */
    .doc-row { display: flex; align-items: center; padding: 10px 14px; border-bottom: 1px solid #f2f2f7; gap: 10px; }
    .doc-row:last-child { border-bottom: none; }
    .doc-icon { font-size: 22px; flex-shrink: 0; }
    .doc-info { flex: 1; min-width: 0; }
    .doc-type { font-size: 13px; font-weight: 600; }
    .doc-date { font-size: 11px; color: #8e8e93; margin-top: 2px; }
    .doc-link { color: #007AFF; font-size: 12px; flex-shrink: 0; }

    /* ── Status buttons ── */
    .sbtn-grid { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start; }
    .sbtn-wrap { display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .sbtn { padding: 9px 14px; border-radius: 20px; border: 2px solid; background: white; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; transition: all .15s; }
    .sbtn:active { opacity: .75; }
    .sbtn.cg-gray   { border-color: #8e8e93; color: #8e8e93; }
    .sbtn.cg-blue   { border-color: #007AFF; color: #007AFF; }
    .sbtn.cg-orange { border-color: #FF9500; color: #FF9500; }
    .sbtn.cg-green  { border-color: #34C759; color: #34C759; }
    .sbtn.cg-red    { border-color: #FF3B30; color: #FF3B30; }
    .sbtn-blocked { opacity: .4; cursor: not-allowed; }
    .sbtn-hint { font-size: 10px; color: #FF9500; text-align: center; max-width: 100px; line-height: 1.3; }

    /* ── Doc sequential progress ── */
    .doc-progress { display: flex; align-items: flex-start; overflow-x: auto; -webkit-overflow-scrolling: touch; padding: 12px 10px 10px; gap: 0; }
    .dp-item { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 56px; flex-shrink: 0; }
    .dp-icon { font-size: 18px; line-height: 1; }
    .dp-label { font-size: 9px; text-align: center; color: #8e8e93; line-height: 1.2; max-width: 56px; }
    .dp-item.dp-done .dp-label { color: #34C759; font-weight: 700; }
    .dp-item.dp-next .dp-label { color: #FF9500; font-weight: 700; }
    .dp-item.dp-locked .dp-icon { filter: grayscale(1); opacity: .4; }
    .dp-arrow { color: #c7c7cc; font-size: 12px; align-self: center; margin-bottom: 20px; padding: 0 1px; flex-shrink: 0; }
    .doc-other-badge { font-size: 12px; color: #8e8e93; text-align: right; padding: 6px 14px 4px; }

    /* ── Buttons ── */
    .btn { display: block; width: 100%; padding: 14px; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; text-align: center; font-family: inherit; transition: opacity .15s; }
    .btn:active { opacity: .8; }
    .btn-green { background: #06C755; color: white; }
    .back-btn  { display: inline-flex; align-items: center; gap: 4px; color: #06C755; background: none; border: none; font-size: 15px; cursor: pointer; padding: 0; margin-bottom: 12px; font-weight: 500; font-family: inherit; }

    /* ── Overlay ── */
    #overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 100; align-items: flex-end; }
    #overlay.on { display: flex; }
    .ov-box { background: white; border-radius: 20px 20px 0 0; width: 100%; padding: 20px 18px 32px; }
    .ov-title { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
    .ov-sub   { font-size: 13px; color: #8e8e93; margin-bottom: 16px; line-height: 1.4; }
    .ov-section { margin-bottom: 12px; }
    .ov-label { font-size: 12px; color: #8e8e93; margin-bottom: 4px; }
    .ov-input { width: 100%; border: 1.5px solid #e5e5ea; border-radius: 10px; padding: 11px 12px; font-size: 15px; font-family: inherit; outline: none; }
    .ov-input:focus { border-color: #06C755; }
    textarea.ov-input { resize: none; height: 90px; }
    /* File pick: input overlaid on button so LINE WebView can trigger it */
    .file-pick-wrap { position: relative; width: 100%; }
    .file-pick-btn  { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 15px; border: 1.5px dashed #c7c7cc; border-radius: 10px; background: white; font-size: 15px; font-family: inherit; cursor: pointer; color: #636366; }
    .file-pick-btn.has-file { border-color: #06C755; background: #f0fdf4; color: #06C755; }
    .file-pick-inp  { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 0; } /* font-size:0 hides iOS label */
    .file-pick-name { margin-top: 8px; font-size: 13px; color: #06C755; font-weight: 600; word-break: break-all; }
    .ov-btn-row { display: flex; gap: 10px; margin-top: 16px; }
    .ov-btn     { flex: 1; padding: 13px; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; border: none; }
    .ov-btn-primary { background: #06C755; color: white; }
    .ov-btn-cancel  { background: #f2f2f7; color: #3c3c43; }

    /* ── Action panel label ── */
    .ap-lbl { font-size: 12px; color: #636366; font-weight: 600; margin-bottom: 2px; }

    /* ── Misc ── */
    .spin-wrap { display: flex; justify-content: center; padding: 36px 0; }
    .spinner   { width: 28px; height: 28px; border: 3px solid #e5e5ea; border-top-color: #06C755; border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty { text-align: center; padding: 36px 20px; color: #8e8e93; }
    .empty-icon { font-size: 36px; margin-bottom: 8px; }
    .empty-text { font-size: 14px; }
    .toast { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%); background: rgba(28,28,30,.9); color: white; padding: 10px 18px; border-radius: 20px; font-size: 13px; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 200; white-space: nowrap; }
    .toast.on { opacity: 1; }
  </style>
</head>
<body>

<!-- ── Splash ── -->
<div id="splash">
  <div class="splash-icon">📊</div>
  <h2 class="splash-title">Vizzel Sales</h2>
  <p class="splash-sub">ระบบจัดการลูกค้า<br>หน่วยงานราชการ</p>
  <div class="splash-spinner"></div>
</div>

<!-- ── App ── -->
<div id="app">
  <div class="hdr">
    <img id="uPic" src="" alt="">
    <div class="hdr-info">
      <h1>สวัสดี, <span id="uName">...</span></h1>
      <p>Vizzel Sales CRM</p>
    </div>
  </div>

  <div class="tabs">
    <button class="tab on" data-tab="pipeline" onclick="showTab('pipeline')">📊 Pipeline</button>
    <button class="tab"    data-tab="projects" onclick="showTab('projects')">📋 โครงการ</button>
  </div>

  <div class="content">

    <!-- Pipeline -->
    <div class="screen on" id="screen-pipeline">
      <div class="pipe-grid" id="pipeGrid">
        <div class="spin-wrap" style="grid-column:1/-1"><div class="spinner"></div></div>
      </div>
      <div class="sec">โครงการล่าสุด</div>
      <div class="plist" id="pipeRecent"></div>
    </div>

    <!-- Projects list -->
    <div class="screen" id="screen-projects">
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px">
        <input type="text" id="searchInput" placeholder="ค้นหาหน่วยงาน..."
          style="flex:1;padding:10px 14px;border-radius:10px;border:1.5px solid #e5e5ea;font-size:15px;font-family:inherit;outline:none;"
          oninput="onSearchInput()">
        <button onclick="openCreateModal()"
          style="background:#06C755;color:white;border:none;padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit">
          + สร้าง
        </button>
      </div>
      <div class="plist" id="projList"></div>
    </div>

    <!-- Detail -->
    <div class="screen" id="screen-detail">
      <button class="back-btn" onclick="goBack()">‹ กลับ</button>
      <div id="detailContent"></div>
    </div>

  </div><!-- /content -->
</div><!-- /app -->

<!-- ── Overlay ── -->
<div id="overlay" onclick="ovClickOutside(event)">
  <div class="ov-box" id="ov-box">
    <div class="ov-title" id="ov-title"></div>
    <div class="ov-sub"   id="ov-sub"></div>
    <div id="ov-body"></div>
    <div class="ov-btn-row">
      <button class="ov-btn ov-btn-cancel"  onclick="closeOverlay()">ยกเลิก</button>
      <button class="ov-btn ov-btn-primary" id="ov-confirm" onclick="confirmOverlay()">ยืนยัน</button>
    </div>
  </div>
</div>

<div id="province-drop"></div>
<div class="toast" id="toast"></div>

<!-- ── Create project modal ── -->
<div id="createModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center;">
  <div style="background:white;border-radius:16px;padding:24px;width:90%;max-width:480px;max-height:90vh;overflow-y:auto;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
      <h2 style="margin:0;font-size:18px;font-weight:700">สร้างโครงการใหม่</h2>
      <button onclick="closeCreateModal()" style="background:none;border:none;font-size:24px;cursor:pointer;line-height:1;color:#636366">×</button>
    </div>
    <form id="createProjectForm">
      <div style="margin-bottom:14px">
        <label style="font-size:13px;color:#636366;font-weight:600">ชื่อหน่วยงาน *</label>
        <input type="text" id="newAgencyName" required
          placeholder="กรอกชื่อเต็ม เช่น องค์การบริหารส่วนตำบลหนองแวง"
          style="width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid #e5e5ea;font-size:15px;font-family:inherit;margin-top:6px;outline:none;box-sizing:border-box">
        <small id="agencyNameError" style="color:#FF3B30;display:none;margin-top:4px;font-size:12px"></small>
      </div>
      <div style="margin-bottom:14px">
        <label style="font-size:13px;color:#636366;font-weight:600">ประเภทหน่วยงาน *</label>
        <select id="newAgencyType" required
          style="width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid #e5e5ea;font-size:15px;font-family:inherit;margin-top:6px;outline:none;box-sizing:border-box;appearance:none">
          <option value="">-- เลือกประเภท --</option>
          <option>กระทรวง</option><option>กรม</option>
          <option>องค์การบริหารส่วนจังหวัด</option><option>องค์การบริหารส่วนตำบล</option>
          <option>เทศบาลนคร</option><option>เทศบาลเมือง</option><option>เทศบาลตำบล</option>
          <option>รัฐวิสาหกิจ</option><option>โรงเรียน</option><option>วิทยาลัย</option>
          <option>มหาวิทยาลัย</option><option>โรงพยาบาลศูนย์</option>
          <option>โรงพยาบาลทั่วไป</option><option>โรงพยาบาลชุมชน</option>
          <option>โรงพยาบาลเอกชน</option><option>บริษัทเอกชน</option>
        </select>
      </div>
      <div style="margin-bottom:14px">
        <label style="font-size:13px;color:#636366;font-weight:600">จังหวัด</label>
        <select id="newProvince"
          style="width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid #e5e5ea;font-size:15px;font-family:inherit;margin-top:6px;outline:none;box-sizing:border-box;appearance:none;background:white">
          <option value="">-- เลือกจังหวัด --</option>
          <option>กระบี่</option><option>กรุงเทพมหานคร</option><option>กาญจนบุรี</option>
          <option>กาฬสินธุ์</option><option>กำแพงเพชร</option><option>ขอนแก่น</option>
          <option>จันทบุรี</option><option>ฉะเชิงเทรา</option><option>ชลบุรี</option>
          <option>ชัยนาท</option><option>ชัยภูมิ</option><option>ชุมพร</option>
          <option>เชียงราย</option><option>เชียงใหม่</option><option>ตรัง</option>
          <option>ตราด</option><option>ตาก</option><option>นครนายก</option>
          <option>นครปฐม</option><option>นครพนม</option><option>นครราชสีมา</option>
          <option>นครศรีธรรมราช</option><option>นครสวรรค์</option><option>นนทบุรี</option>
          <option>นราธิวาส</option><option>น่าน</option><option>บึงกาฬ</option>
          <option>บุรีรัมย์</option><option>ปทุมธานี</option><option>ประจวบคีรีขันธ์</option>
          <option>ปราจีนบุรี</option><option>ปัตตานี</option><option>พระนครศรีอยุธยา</option>
          <option>พะเยา</option><option>พังงา</option><option>พัทลุง</option>
          <option>พิจิตร</option><option>พิษณุโลก</option><option>เพชรบุรี</option>
          <option>เพชรบูรณ์</option><option>แพร่</option><option>ภูเก็ต</option>
          <option>มหาสารคาม</option><option>มุกดาหาร</option><option>แม่ฮ่องสอน</option>
          <option>ยโสธร</option><option>ยะลา</option><option>ร้อยเอ็ด</option>
          <option>ระนอง</option><option>ระยอง</option><option>ราชบุรี</option>
          <option>ลพบุรี</option><option>ลำปาง</option><option>ลำพูน</option>
          <option>เลย</option><option>ศรีสะเกษ</option><option>สกลนคร</option>
          <option>สงขลา</option><option>สตูล</option><option>สมุทรปราการ</option>
          <option>สมุทรสงคราม</option><option>สมุทรสาคร</option><option>สระแก้ว</option>
          <option>สระบุรี</option><option>สิงห์บุรี</option><option>สุโขทัย</option>
          <option>สุพรรณบุรี</option><option>สุราษฎร์ธานี</option><option>สุรินทร์</option>
          <option>หนองคาย</option><option>หนองบัวลำภู</option><option>อ่างทอง</option>
          <option>อำนาจเจริญ</option><option>อุดรธานี</option><option>อุตรดิตถ์</option>
          <option>อุทัยธานี</option><option>อุบลราชธานี</option>
        </select>
      </div>
      <div style="margin-bottom:14px">
        <label style="font-size:13px;color:#636366;font-weight:600">ผู้ติดต่อ</label>
        <input type="text" id="newContactName" placeholder="ชื่อผู้ติดต่อ"
          style="width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid #e5e5ea;font-size:15px;font-family:inherit;margin-top:6px;outline:none;box-sizing:border-box">
      </div>
      <div style="margin-bottom:14px">
        <label style="font-size:13px;color:#636366;font-weight:600">ตำแหน่ง</label>
        <input type="text" id="newContactPosition" placeholder="ตำแหน่ง / แผนก"
          style="width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid #e5e5ea;font-size:15px;font-family:inherit;margin-top:6px;outline:none;box-sizing:border-box">
      </div>
      <div style="margin-bottom:20px">
        <label style="font-size:13px;color:#636366;font-weight:600">โทรศัพท์ *</label>
        <input type="tel" id="newPhone" required placeholder="0812345678"
          style="width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid #e5e5ea;font-size:15px;font-family:inherit;margin-top:6px;outline:none;box-sizing:border-box">
      </div>
      <div id="createError" style="color:#FF3B30;margin-bottom:12px;display:none;font-size:13px;line-height:1.5"></div>
      <button type="submit" id="createSubmitBtn"
        style="width:100%;background:#06C755;color:white;border:none;padding:14px;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit">
        สร้างโครงการ
      </button>
    </form>
  </div>
</div>

<script>
const LIFF_ID = "2010133685-tke1EWht";
const API     = "https://vizzel-sales-api.fly.dev";

let token    = "";
let projects = [];
let curTab   = "pipeline";
let prevTab  = "pipeline";
let detailProjectID = "";
let currentProject  = null;
let currentDocs     = [];

async function fetchWithTimeout(url, options = {}, timeoutMs = 8000) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  try {
    const res = await fetch(url, { ...options, signal: controller.signal });
    clearTimeout(timer);
    return res;
  } catch (err) {
    clearTimeout(timer);
    throw err;
  }
}

/* ─── Status metadata ─── */
const STATUS = {
  registrator: { label: "Registrator",     short: "Registr.",   group: "gray"   },
  present:     { label: "นัดหมาย Present", short: "Present",    group: "blue"   },
  demo:        { label: "นัดหมาย Demo",    short: "Demo",       group: "blue"   },
  site_survey: { label: "Site Survey",     short: "Survey",     group: "blue"   },
  quotation:   { label: "ส่งใบเสนอราคา",  short: "Quotation",  group: "orange" },
  tor:         { label: "ส่งร่าง TOR",     short: "TOR",        group: "orange" },
  contract:    { label: "สัญญาแล้ว",       short: "Contract",   group: "green"  },
  closed:      { label: "ปิดงาน",          short: "Closed",     group: "green"  },
  reject:      { label: "Reject",          short: "Reject",     group: "red"    },
};
const STATUS_KEYS = Object.keys(STATUS);

/* Doc type display names (new scheme – auto-advance via upload) */
const DOC_NAMES = {
  quotation_support: "ใบเสนอราคา (Support)",
  tor_support:       "ร่าง TOR (Support)",
  tor_dealer:        "ร่าง TOR (Dealer)",
  contract:          "เอกสารสัญญา",
  closing:           "เอกสารปิดงาน",
  site_survey:       "เอกสาร Site Survey",
};

/* Sequential progress bar doc types */
const DOC_TYPES_SEQ = ["quotation_support","tor_support","contract","closing"];

/* Statuses that trigger a Google Calendar appointment */
const APPT_STATUSES = new Set(["present","demo","site_survey"]);

/* ─── Init ─── */
async function init() {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login({ scope: "profile openid email" }); return; }
    await loginWithLine();
  } catch(e) {
    const el = document.createElement("p");
    el.className = "splash-err";
    el.textContent = "เกิดข้อผิดพลาด: " + e.message;
    document.getElementById("splash").appendChild(el);
  }
}

async function loginWithLine() {
  const accessToken = liff.getAccessToken();
  const profile     = await liff.getProfile();
  // Email from OIDC ID token — present only when "email" scope is granted on the LINE channel
  const email = liff.getDecodedIDToken()?.email || "";

  document.getElementById("uName").textContent = profile.displayName;
  document.getElementById("uPic").src          = profile.pictureUrl || "";

  const res = await fetchWithTimeout(API + "/api/v1/auth/line", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ access_token: accessToken, email }),
  });
  if (!res.ok) throw new Error("auth failed " + res.status);
  token = (await res.json()).token;

  document.getElementById("splash").style.display = "none";
  document.getElementById("app").style.display    = "flex";
  loadProjects();
}

/* ─── Data ─── */
async function loadProjects() {
  try {
    const res = await fetchWithTimeout(API + "/api/v1/projects", {
      headers: { Authorization: "Bearer " + token },
    });
    if (!res.ok) throw new Error();
    projects = await res.json();
    renderPipeline();
    renderProjList();
  } catch {
    toast("โหลดข้อมูลไม่สำเร็จ");
    document.getElementById("pipeGrid").innerHTML = emptyH("⚠️","โหลดไม่สำเร็จ","grid-column:1/-1");
  }
}

/* ─── Pipeline ─── */
function renderPipeline() {
  const counts = {};
  STATUS_KEYS.forEach(s => counts[s] = 0);
  projects.forEach(p => { if (counts[p.status] !== undefined) counts[p.status]++; });

  document.getElementById("pipeGrid").innerHTML = STATUS_KEYS.map(s => {
    const g = STATUS[s].group;
    return `<div class="pipe-card cg-${g}" onclick="filterGo('${s}')">
      <div class="cnt">${counts[s]}</div>
      <div class="lbl">${STATUS[s].short}</div>
    </div>`;
  }).join("");

  const recent = projects.slice(0, 5);
  document.getElementById("pipeRecent").innerHTML =
    recent.length ? recent.map(rowH).join("") : emptyH("📂","ยังไม่มีโครงการ");
}

function filterGo(status) {
  renderProjList(status);
  showTab("projects", false);
}

/* ─── Project list ─── */
function renderProjList(filterStatus) {
  // Clear search bar when rendering the full unfiltered list
  const searchEl = document.getElementById("searchInput");
  if (searchEl && !filterStatus) searchEl.value = "";
  const list = filterStatus ? projects.filter(p => p.status === filterStatus) : projects;
  document.getElementById("projList").innerHTML =
    list.length ? list.map(rowH).join("") : emptyH("📂","ยังไม่มีโครงการ");
}

/* ─── Search ─── */
let _searchTimer = null;
function onSearchInput() {
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(doSearch, 400);
}

async function doSearch() {
  const q = document.getElementById("searchInput")?.value.trim() || "";
  if (!q) { renderProjList(); return; }
  try {
    const res = await fetchWithTimeout(
      `${API}/api/v1/projects?search=${encodeURIComponent(q)}`,
      { headers: { Authorization: "Bearer " + token } }
    );
    if (!res.ok) throw new Error();
    const results = await res.json();
    document.getElementById("projList").innerHTML = results.length
      ? results.map(rowH).join("")
      : emptyH("🔍", `ไม่พบหน่วยงาน "${q}"`);
  } catch {
    toast("ค้นหาไม่สำเร็จ");
  }
}

/* ─── Create modal ─── */
function openCreateModal() {
  document.getElementById("createModal").style.display = "flex";
  document.getElementById("createProjectForm").reset();
  document.getElementById("createError").style.display   = "none";
  document.getElementById("agencyNameError").style.display = "none";
}

function closeCreateModal() {
  document.getElementById("createModal").style.display = "none";
}

document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("createModal").addEventListener("click", function(e) {
    if (e.target === this) closeCreateModal();
  });

  // Refresh document list when upload tab posts UPLOAD_SUCCESS back to this window
  window.addEventListener("message", function(event) {
    if (!event.data || event.data.type !== "UPLOAD_SUCCESS") return;
    if (!detailProjectID) return;
    fetchProjectDocs(detailProjectID).then(docs => {
      renderDocsSection(docs, detailProjectID);
      const p = projects.find(x => x.id === detailProjectID);
      if (p) renderStatusSection(p, docs);
    });
  });

  document.getElementById("createProjectForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const agencyName = document.getElementById("newAgencyName").value;
    const nameErrEl  = document.getElementById("agencyNameError");
    const errEl      = document.getElementById("createError");
    const btn        = document.getElementById("createSubmitBtn");

    // Client-side validation (mirrors backend rules)
    const trimmed = agencyName.trim();
    const abbrev  = /อบต\.?|อบจ\.?|ทต\.?|ทน\.?|ทม\.?|\.$|^\.|\.{2,}/;
    if (!trimmed) {
      nameErrEl.textContent    = "กรุณากรอกชื่อหน่วยงาน";
      nameErrEl.style.display  = "block";
      return;
    }
    if (abbrev.test(trimmed)) {
      nameErrEl.textContent    = "กรุณาใส่ชื่อหน่วยงานแบบเต็ม ไม่ใช้ตัวย่อหรือจุด (.)";
      nameErrEl.style.display  = "block";
      return;
    }
    nameErrEl.style.display = "none";
    errEl.style.display     = "none";

    btn.textContent = "กำลังสร้าง...";
    btn.disabled    = true;

    try {
      const res = await fetchWithTimeout(API + "/api/v1/projects", {
        method:  "POST",
        headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
        body: JSON.stringify({
          agency_name:      trimmed,
          agency_type:      document.getElementById("newAgencyType").value,
          region:           document.getElementById("newProvince").value.trim(),
          contact_person:   document.getElementById("newContactName").value.trim(),
          contact_position: document.getElementById("newContactPosition").value.trim(),
          contact_phone:    document.getElementById("newPhone").value.trim(),
        }),
      });

      const data = await res.json();

      if (!res.ok) {
        if (data.existing_project_id) {
          const eid = data.existing_project_id;
          errEl.innerHTML = `${esc(data.error)} <a href="#" style="color:#007AFF"
            onclick="closeCreateModal();showDetail('${eid}');return false;">ดูโครงการ ›</a>`;
        } else {
          errEl.textContent = data.error || "เกิดข้อผิดพลาด";
        }
        errEl.style.display = "block";
        return;
      }

      closeCreateModal();
      projects.unshift(data);
      renderPipeline();
      renderProjList();
      showDetail(data.id);

    } catch {
      errEl.textContent    = "ไม่สามารถเชื่อมต่อได้ กรุณาลองใหม่";
      errEl.style.display  = "block";
    } finally {
      btn.textContent = "สร้างโครงการ";
      btn.disabled    = false;
    }
  });
});

function rowH(p) {
  const sub = [p.agency_type, p.region].filter(Boolean).join(" · ");
  const g   = STATUS[p.status]?.group || "gray";
  return `<div class="prow" onclick="showDetail('${esc(p.id)}')">
    <div class="prow-info">
      <div class="prow-name">${esc(p.agency_name||'-')}</div>
      ${sub ? `<div class="prow-sub">${esc(sub)}</div>` : ""}
    </div>
    <span class="bdg bg-${g}">${STATUS[p.status]?.short || p.status}</span>
    <span class="chev">›</span>
  </div>`;
}

/* ─── Detail ─── */
async function showDetail(id) {
  prevTab = curTab;
  detailProjectID = id;
  const p = projects.find(x => x.id === id);
  if (!p) return;

  currentProject = p;
  activateScreen("detail");
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("on"));

  // Render project info immediately; docs + status buttons after we know what's uploaded
  document.getElementById("detailContent").innerHTML =
    buildDetailInfo(p) +
    buildNoteSection(p) +
    `<div class="sec" style="margin-bottom:7px">เอกสาร</div>
     <div id="docsSection"><div class="spin-wrap"><div class="spinner"></div></div></div>
     <div class="sec" style="margin-bottom:7px">เปลี่ยนสถานะ</div>
     <div id="statusSection"><div class="spin-wrap"><div class="spinner"></div></div></div>`;

  let docs = [];
  try {
    docs = await fetchProjectDocs(id);
  } catch { /* fetchProjectDocs returns [] on error; this is a safety net */ }

  try {
    renderDocsSection(docs, id);
  } catch {
    const el = document.getElementById("docsSection");
    if (el) el.innerHTML = `<div class="dcard" style="padding:14px">${emptyH("⚠️","ไม่สามารถโหลดเอกสารได้")}</div>`;
  }
  try {
    renderStatusSection(p, docs);
  } catch {
    const el = document.getElementById("statusSection");
    if (el) el.innerHTML = `<p style="color:#8e8e93;font-size:13px;text-align:center;padding:16px">ไม่สามารถโหลดสถานะได้ กรุณารีเฟรช</p>`;
  }
}

function buildDetailInfo(p) {
  const rows = [
    ["หน่วยงาน",   p.agency_name || "-"],
    ["ประเภท",     p.agency_type || "-"],
    ["จังหวัด",    p.region || "-"],
    ["ผู้ติดต่อ",  p.contact_person || "-"],
    ["ตำแหน่ง",    p.contact_position || "-"],
    ["โทรศัพท์",   p.contact_phone
        ? `<a href="tel:${esc(p.contact_phone)}">${esc(p.contact_phone)}</a>` : "-"],
    ["สถานะ",      `<span class="bdg bg-${STATUS[p.status]?.group||'gray'}">${STATUS[p.status]?.label||p.status}</span>`],
    ...(p.present_type  ? [["รูปแบบ Present", p.present_type === "online" ? "🖥 Online" : "🏢 Onsite"]] : []),
    ...(p.reject_reason ? [["เหตุผล Reject",  esc(p.reject_reason)]] : []),
    ...(p.status_note   ? [["หมายเหตุ",       esc(p.status_note)]]   : []),
    ["สร้างเมื่อ", fmtDate(p.created_at)],
  ];
  return `<div class="dcard" style="margin-bottom:12px">${
    rows.map(([k,v]) => `<div class="drow"><div class="dkey">${k}</div><div class="dval">${v}</div></div>`).join("")
  }</div>`;
}

function buildNoteSection(p) {
  const note     = p.detail_note || "";
  const isClosed = p.status === "closed";
  const viewText = note
    ? `<span style="white-space:pre-wrap">${esc(note)}</span>`
    : `<span style="color:#c7c7cc">-</span>`;
  return `<div id="noteSection" style="background:white;border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.07)">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <label style="font-weight:700;font-size:14px;color:#1c1c1e">รายละเอียดเพิ่มเติม</label>
      ${!isClosed ? `<button id="noteEditBtn" onclick="enableNoteEdit()"
        style="background:none;border:1px solid #c7c7cc;border-radius:6px;padding:4px 12px;font-size:13px;cursor:pointer;color:#636366;font-family:inherit">
        ✏️ แก้ไข
      </button>` : ""}
    </div>
    <div id="noteViewMode">
      <p id="noteViewText" style="color:#636366;font-size:14px;min-height:40px;margin:0">${viewText}</p>
    </div>
    <div id="noteEditMode" style="display:none">
      <textarea id="noteInput" maxlength="2000" placeholder="กรอกรายละเอียดเพิ่มเติม..."
        oninput="noteCharUpdate()"
        style="width:100%;height:120px;padding:10px;border-radius:8px;border:1px solid #ddd;font-size:14px;resize:vertical;box-sizing:border-box;font-family:inherit;outline:none"></textarea>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px">
        <span id="noteCharCount" style="font-size:12px;color:#8e8e93">0 / 2000</span>
        <div style="display:flex;gap:8px">
          <button onclick="cancelNoteEdit()"
            style="border:1px solid #c7c7cc;background:white;border-radius:6px;padding:6px 16px;cursor:pointer;color:#636366;font-family:inherit;font-size:14px">
            ยกเลิก
          </button>
          <button onclick="saveNote()"
            style="background:#06C755;border:none;border-radius:6px;padding:6px 16px;color:white;font-weight:700;cursor:pointer;font-family:inherit;font-size:14px">
            บันทึก
          </button>
        </div>
      </div>
    </div>
  </div>`;
}

function noteCharUpdate() {
  const inp = document.getElementById("noteInput");
  const cnt = document.getElementById("noteCharCount");
  if (inp && cnt) cnt.textContent = `${inp.value.length} / 2000`;
}

function enableNoteEdit() {
  if (currentProject?.status === "closed") {
    toast("ไม่สามารถแก้ไขได้ เนื่องจากงานปิดแล้ว");
    return;
  }
  document.getElementById("noteViewMode").style.display = "none";
  document.getElementById("noteEditMode").style.display = "block";
  const btn = document.getElementById("noteEditBtn");
  if (btn) btn.style.display = "none";
  const current = currentProject?.detail_note || "";
  const inp = document.getElementById("noteInput");
  if (inp) { inp.value = current; noteCharUpdate(); }
}

function cancelNoteEdit() {
  document.getElementById("noteViewMode").style.display = "block";
  document.getElementById("noteEditMode").style.display = "none";
  const btn = document.getElementById("noteEditBtn");
  if (btn) btn.style.display = "block";
}

async function saveNote() {
  const inp  = document.getElementById("noteInput");
  const note = inp ? inp.value : "";
  const projectId = currentProject?.id;
  if (!projectId) return;

  try {
    const res = await fetchWithTimeout(`${API}/api/v1/projects/${projectId}`, {
      method:  "PUT",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
      body:    JSON.stringify({ detail_note: note }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      toast(err.error || `บันทึกไม่สำเร็จ (${res.status})`);
      return;
    }
    if (currentProject) currentProject.detail_note = note;
    const p = projects.find(x => x.id === projectId);
    if (p) p.detail_note = note;
    const viewText = document.getElementById("noteViewText");
    if (viewText) viewText.innerHTML = note
      ? `<span style="white-space:pre-wrap">${esc(note)}</span>`
      : `<span style="color:#c7c7cc">-</span>`;
    cancelNoteEdit();
    toast("บันทึกรายละเอียดแล้ว ✓");
  } catch {
    toast("ไม่สามารถเชื่อมต่อได้ กรุณาลองใหม่");
  }
}

async function fetchProjectDocs(projectID) {
  try {
    const res = await fetchWithTimeout(`${API}/api/v1/projects/${projectID}/documents`, {
      headers: { Authorization: "Bearer " + token },
    });
    return res.ok ? await res.json() : [];
  } catch { return []; }
}

function renderDocsSection(docs, projectID) {
  const el = document.getElementById("docsSection");
  if (!el) return;

  currentDocs = docs;  // keep module-level copy for delete/upload helpers
  const isClosed = currentProject?.status === "closed";

  const docTypeSet = new Set(docs.map(d => d.doc_type));

  // Sequential progress bar
  let foundMissing = false;
  const progressItems = DOC_TYPES_SEQ.map((dt, i) => {
    const done = docTypeSet.has(dt);
    let state, icon;
    if (done) { state = "dp-done"; icon = "✅"; }
    else if (!foundMissing) { foundMissing = true; state = "dp-next"; icon = "⏳"; }
    else { state = "dp-locked"; icon = "🔒"; }
    const arrow = i < DOC_TYPES_SEQ.length - 1
      ? `<div class="dp-arrow">›</div>` : "";
    return `<div class="dp-item ${state}">
      <div class="dp-icon">${icon}</div>
      <div class="dp-label">${DOC_NAMES[dt]}</div>
    </div>${arrow}`;
  }).join("");

  const docRows = docs.length
    ? docs.map(d => `
        <div class="doc-row">
          <div class="doc-icon">${fileIcon(d.file_name)}</div>
          <div class="doc-info">
            <div class="doc-type">${esc(DOC_NAMES[d.doc_type] || d.doc_type || "เอกสาร")}</div>
            <div class="doc-date">${esc(d.file_name || '')}${d.file_name && d.created_at ? ' · ' : ''}${fmtDate(d.created_at)}</div>
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            <a class="doc-link" href="${esc(d.file_url)}" target="_blank">ดู ›</a>
            ${!isClosed ? `<button onclick="deleteDocument('${esc(d.id)}')"
              style="background:none;border:none;color:#FF3B30;font-size:18px;cursor:pointer;padding:0;line-height:1"
              title="ลบเอกสาร">🗑</button>` : ""}
          </div>
        </div>`).join("")
    : `<div style="border-top:1px solid #f2f2f7">${emptyH("📎","ยังไม่มีเอกสาร")}</div>`;

  // Show "+" upload button only when there is a next required doc and project is not closed
  const nextType  = getNextDocType(currentProject, docs);
  const uploadBtn = nextType && !isClosed
    ? `<button class="btn btn-green" style="margin-top:8px;font-size:14px"
             onclick="openUploadOverlay('${esc(projectID)}')">+ แนบเอกสาร</button>`
    : "";

  el.innerHTML = `
    <div class="dcard" style="overflow:hidden">
      <div class="doc-progress">${progressItems}</div>
      <div style="border-top:1px solid #f2f2f7">${docRows}</div>
    </div>
    ${uploadBtn}`;
}

/* ─── Action panels (replaces old status buttons) ─── */

function renderStatusSection(p, docs) {
  const el = document.getElementById("statusSection");
  if (!el) return;

  // Terminal states: read-only banners
  if (p.status === "closed") {
    el.innerHTML = `<div class="dcard" style="padding:20px;text-align:center">
      <div style="font-size:28px;margin-bottom:8px">✅</div>

/* ─── Action panel helpers ─── */

function toggleActionPanel(panelId, arrowId) {
  const panel = document.getElementById(panelId);
  const arrow = document.getElementById(arrowId);
  if (!panel) return;
  const open = panel.style.display === "none";
  panel.style.display = open ? "block" : "none";
  if (arrow) arrow.textContent = open ? "⌄" : "›";
}

function openDocUpload(projectId, docType) {
  const url = "https://vizzelintel.github.io/vizzel-sales-frontend/upload.html" +
    "?project_id=" + encodeURIComponent(projectId) +
    "&token="      + encodeURIComponent(token) +
    "&doc_type="   + encodeURIComponent(docType);
  liff.openWindow({ url, external: true });
}

// Maps project status to the doc_type that should be uploaded next.
// Returns null for statuses where ad-hoc upload is not applicable.
function getDocTypeForStatus(status) {
  const map = {
    present:     "quotation_support",
    demo:        "quotation_support",
    site_survey: "site_survey",
    quotation:   "tor_support",   // special: 2 options handled in openUploadOverlay
    tor:         "contract",
    contract:    "closing",
  };
  return map[status] || null;
}

// Returns the next doc_type that should be uploaded based on current status AND
// what has already been uploaded. More precise than getDocTypeForStatus alone.
function getNextDocType(project, docs) {
  const status   = project?.status || "";
  const uploaded = (docs || []).map(d => d.doc_type);
  const has      = t => uploaded.includes(t);

  if (["present","demo","site_survey"].includes(status)) {
    return has("quotation_support") ? null : "quotation_support";
  }
  if (status === "quotation") {
    if (!has("tor_support")) return "tor_support";
    if (!has("tor_dealer"))  return "tor_dealer";
    return null;
  }
  if (status === "tor")      return has("contract") ? null : "contract";
  if (status === "contract") return has("closing")  ? null : "closing";
  return null;
}

async function deleteDocument(docId) {
  if (!confirm("ต้องการลบเอกสารนี้ใช่ไหม?")) return;
  try {
    const res = await fetchWithTimeout(`${API}/api/v1/documents/${docId}`, {
      method:  "DELETE",
      headers: { Authorization: "Bearer " + token },
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      toast(err.error || "ลบไม่สำเร็จ");
      return;
    }
    toast("ลบเอกสารสำเร็จ ✓");
    if (detailProjectID) {
      const docs = await fetchProjectDocs(detailProjectID);
      currentDocs = docs;
      renderDocsSection(docs, detailProjectID);
      const p = projects.find(x => x.id === detailProjectID);
      if (p) renderStatusSection(p, docs);
    }
  } catch {
    toast("ไม่สามารถเชื่อมต่อได้");
  }
}

async function submitPresent(projectId) {
  const date = document.getElementById("ap-present-date")?.value;
  const type = document.getElementById("ap-present-type")?.value;
  const note = document.getElementById("ap-present-note")?.value.trim() || "";
  if (!date) { toast("กรุณาเลือกวันและเวลานัดหมาย"); return; }
  if (!type) { toast("กรุณาเลือกรูปแบบ (Online/Onsite)"); return; }
  await doChangeStatus(projectId, "present", note, "", new Date(date).toISOString(), "", type);
}

async function submitDemo(projectId) {
  const date = document.getElementById("ap-demo-date")?.value;
  const note = document.getElementById("ap-demo-note")?.value.trim() || "";
  if (!date) { toast("กรุณาเลือกวันและเวลา"); return; }
  await doChangeStatus(projectId, "demo", note, "", new Date(date).toISOString());
}

async function submitSurvey(projectId) {
  const date = document.getElementById("ap-survey-date")?.value;
  const note = document.getElementById("ap-survey-note")?.value.trim() || "";
  if (!date) { toast("กรุณาเลือกวันและเวลา"); return; }
  await doChangeStatus(projectId, "site_survey", note, "", new Date(date).toISOString());

function openRejectPanel(projectId) {
  _pendingProjectID = projectId;
  _pendingStatus    = "reject";

}

/* ─── (keep for compatibility – Reject still uses overlay) ─── */
let _pendingStatus    = "";
let _pendingProjectID = "";

async function doChangeStatus(projectID, status, statusNote, rejectReason, appointmentDate, appointmentNote, presentType) {
  try {
    const res = await fetchWithTimeout(`${API}/api/v1/projects/${projectID}/status`, {
      method: "PUT",
      headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
      body: JSON.stringify({
        status,
        status_note:      statusNote      || "",
        reject_reason:    rejectReason    || "",
        appointment_date: appointmentDate || "",
        appointment_note: appointmentNote || "",
        present_type:     presentType     || "",
      }),
    });
    const data = await res.json();
    if (!res.ok) { toast(data.error || "เปลี่ยนสถานะไม่สำเร็จ"); return; }

    const p = projects.find(x => x.id === projectID);
    if (p) {
      p.status            = status;
      p.status_note       = statusNote      || "";
      p.reject_reason     = rejectReason    || "";
      p.appointment_date  = appointmentDate || "";
      p.appointment_note  = appointmentNote || "";
      p.calendar_event_id = data.calendar_event_id || "";
      if (presentType) p.present_type = presentType;
    }

    if (APPT_STATUSES.has(status) && appointmentDate) {
      toast(data.calendar_ok
        ? "✅ บันทึกนัดหมายในปฏิทินแล้ว"
        : "⚠️ เปลี่ยนสถานะแล้ว แต่ไม่สามารถบันทึกปฏิทินได้");
    } else {
      toast("อัปเดตสถานะสำเร็จ ✓");
    }

    renderPipeline();
    renderProjList();
    if (p) {
      currentProject = p;
      // Re-render detail: refresh docs so status buttons reflect updated requirements
      document.getElementById("detailContent").innerHTML =
        buildDetailInfo(p) +
        buildNoteSection(p) +
        `<div class="sec" style="margin-bottom:7px">เอกสาร</div>
         <div id="docsSection"><div class="spin-wrap"><div class="spinner"></div></div></div>
         <div class="sec" style="margin-bottom:7px">เปลี่ยนสถานะ</div>
         <div id="statusSection"><div class="spin-wrap"><div class="spinner"></div></div></div>`;
      let docs = [];
      try { docs = await fetchProjectDocs(projectID); } catch {}
      try {
        renderDocsSection(docs, projectID);
      } catch {
        const el = document.getElementById("docsSection");
        if (el) el.innerHTML = `<div class="dcard" style="padding:14px">${emptyH("⚠️","ไม่สามารถโหลดเอกสารได้")}</div>`;
      }
      try {
        renderStatusSection(p, docs);
      } catch {
        const el = document.getElementById("statusSection");
        if (el) el.innerHTML = `<p style="color:#8e8e93;font-size:13px;text-align:center;padding:16px">ไม่สามารถโหลดสถานะได้ กรุณารีเฟรช</p>`;
      }
    }
  } catch { toast("เปลี่ยนสถานะไม่สำเร็จ"); }
}

/* ─── Overlay: document upload — uses getNextDocType for smart determination ─── */
function openUploadOverlay(projectID) {
  const status  = currentProject?.status || "";
  const docType = getNextDocType(currentProject, currentDocs);

  if (!docType) {
    toast("แนบเอกสารครบแล้วสำหรับสถานะนี้");
    return;
  }

  if (status === "quotation") {
    // Quotation needs two TOR options — show a choice overlay
    const iid = esc(projectID);
    document.getElementById("ov-title").textContent = "แนบร่าง TOR";
    document.getElementById("ov-sub").textContent   = "เลือกประเภทไฟล์ TOR";
    document.getElementById("ov-body").innerHTML    = `
      <div style="display:flex;flex-direction:column;gap:10px">
        <button class="ov-btn ov-btn-primary"
          onclick="closeOverlay();openDocUpload('${iid}','tor_support')">
          📎 แนบ TOR จาก Support (หลัก)
        </button>
        <button class="ov-btn ov-btn-cancel"
          onclick="closeOverlay();openDocUpload('${iid}','tor_dealer')">
          📎 แนบ TOR จาก Dealer (ไม่บังคับ)
        </button>
      </div>`;
    document.getElementById("ov-confirm").style.display = "none";
    document.getElementById("overlay").classList.add("on");
  } else {
    // All other statuses: go directly to upload page
    openDocUpload(projectID, docType);
  }
}

/* ─── Overlay: reject reason ─── */
function openRejectOverlay() {
  document.getElementById("ov-title").textContent = "ระบุเหตุผล Reject";
  document.getElementById("ov-sub").textContent   = "กรุณาระบุเหตุผลก่อนยืนยัน Reject";
  document.getElementById("ov-body").innerHTML    =
    `<div class="ov-section">
       <textarea class="ov-input" id="ov-reason" placeholder="เหตุผลที่ปฏิเสธ..."></textarea>
     </div>`;

  document.getElementById("overlay").classList.add("on");
}

/* ─── Overlay confirm ─── */
async function confirmOverlay() {
  // Reject: validate before closing
  if (_pendingStatus === "reject") {
    const reason = document.getElementById("ov-reason")?.value.trim() || "";
    if (!reason) { toast("กรุณาระบุเหตุผลที่ปฏิเสธ"); return; }
    closeOverlay();
    await doChangeStatus(_pendingProjectID, "reject", "", reason);
    return;
  }

}

function closeOverlay() {
  document.getElementById("overlay").classList.remove("on");
  const c = document.getElementById("ov-confirm");
  if (c) c.style.display = "";
}
function ovClickOutside(e) { if (e.target === document.getElementById("overlay")) closeOverlay(); }

/* ─── Navigation ─── */
function showTab(tab, resetList) {
  if (resetList !== false) renderProjList();
  prevTab = curTab;
  curTab  = tab;
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.tab === tab));
  activateScreen(tab);
}

function activateScreen(name) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("on"));
  document.getElementById("screen-" + name)?.classList.add("on");
}

function goBack() { showTab(prevTab, false); }

/* ─── Helpers ─── */
function emptyH(icon, text, style) {
  return `<div class="empty"${style ? ` style="${style}"` : ""}><div class="empty-icon">${icon}</div><div class="empty-text">${text}</div></div>`;
}

function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("on");
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove("on"), 2600);
}

function fmtDate(iso) {
  if (!iso) return "-";
  return new Date(iso).toLocaleDateString("th-TH", { year: "numeric", month: "short", day: "numeric" });
}

function esc(s) {
  return String(s || "")
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function fileIcon(filename) {
  const ext = (filename || "").split(".").pop().toLowerCase();
  if (ext === "pdf")               return "📄";
  if (["doc","docx"].includes(ext)) return "📝";
  if (["xls","xlsx"].includes(ext)) return "📊";
  return "📎";
}

function fmtSize(bytes) {
  if (!bytes) return "";
  if (bytes < 1024)        return bytes + " B";
  if (bytes < 1048576)     return (bytes / 1024).toFixed(1) + " KB";
  return (bytes / 1048576).toFixed(1) + " MB";
}

// When the user returns from the external upload page, refresh the
// document list so newly uploaded files appear immediately.
document.addEventListener("visibilitychange", () => {
  if (document.hidden || !detailProjectID) return;
  fetchProjectDocs(detailProjectID).then(docs => {
    renderDocsSection(docs, detailProjectID);
    const p = projects.find(x => x.id === detailProjectID);
    if (p) renderStatusSection(p, docs);
  });
});
