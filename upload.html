<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>อัปโหลดเอกสาร - Vizzel Sales</title>
  <style>
    :root {
      --vi-purple: #7B3FF2;
      --vi-purple-dark: #5B21B6;
      --vi-blue: #00A8E8;
      --vi-bg: #FFFFFF;
      --vi-page: #F5F3FF;
      --vi-text: #1E1B4B;
      --vi-muted: #64748B;
      --vi-border: #E2E8F0;
      --vi-gradient: linear-gradient(135deg, #7B3FF2 0%, #00A8E8 100%);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
           background: var(--vi-bg); color: var(--vi-text); padding: 28px 16px; min-height: 100vh; }

    .header { text-align: center; margin-bottom: 24px; }
    .header-logo-wrap { display: inline-block; background: var(--vi-gradient); padding: 10px 14px; border-radius: 12px; margin-bottom: 12px; }
    .header-logo { height: 40px; width: auto; max-width: 180px; object-fit: contain; display: block; }
    .header-title { font-size: 20px; font-weight: 700; color: var(--vi-purple-dark); }
    .header-sub   { font-size: 13px; color: var(--vi-muted); margin-top: 4px; }

    .card { background: white; border-radius: 12px; padding: 18px 16px;
            margin-bottom: 14px; box-shadow: 0 2px 12px rgba(91, 33, 182, 0.06); border: 1px solid var(--vi-border); }

    .lbl { font-size: 12px; color: var(--vi-muted); font-weight: 600;
           text-transform: uppercase; letter-spacing: .4px; margin-bottom: 8px; }

    select { width: 100%; border: 1.5px solid var(--vi-border); border-radius: 10px;
             padding: 12px; font-size: 15px; font-family: inherit; color: var(--vi-text);
             background: white; outline: none; appearance: none; -webkit-appearance: none; }
    select:focus { border-color: var(--vi-purple); }

    .file-wrap { position: relative; }
    .file-btn  { display: flex; align-items: center; justify-content: center; gap: 10px;
                 width: 100%; padding: 16px; border: 1.5px dashed #c7c7cc;
                 border-radius: 10px; background: white; font-size: 15px;
                 font-family: inherit; cursor: pointer; color: #636366; }
    .file-btn.has-file { border-color: var(--vi-purple); background: #EDE9FE; color: var(--vi-purple-dark); }
    .file-inp  { position: absolute; top: 0; left: 0; width: 100%; height: 100%;
                 opacity: 0; cursor: pointer; font-size: 0; }
    .file-meta { margin-top: 8px; font-size: 13px; color: var(--vi-purple); font-weight: 600; word-break: break-all; }

    .btn { display: block; width: 100%; padding: 16px; border: none;
           border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer;
           text-align: center; font-family: inherit; background: var(--vi-gradient); color: white;
           transition: opacity .15s; margin-top: 6px; box-shadow: 0 2px 8px rgba(123, 63, 242, 0.25); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }

    .spinner { display: inline-block; width: 18px; height: 18px;
               border: 2px solid rgba(255,255,255,.4); border-top-color: white;
               border-radius: 50%; animation: spin .7s linear infinite;
               vertical-align: middle; margin-right: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .msg { padding: 16px; border-radius: 12px; font-size: 14px; line-height: 1.6;
           text-align: center; margin-top: 14px; white-space: pre-line; }
    .msg-ok  { background: #EDE9FE; color: var(--vi-purple-dark); }
    .msg-err { background: #ffe5e5; color: #c0392b; }

    .err-banner { background: #F5F3FF; border-radius: 10px; padding: 14px; border: 1px solid var(--vi-border);
                  font-size: 13px; color: var(--vi-purple-dark); line-height: 1.5; text-align: center; }
  </style>
</head>
<body>

<div class="header">
  <div class="header-logo-wrap">
    <img src="assets/logo.png" alt="Vizzel Intel Access" class="header-logo">
  </div>
  <div class="header-title">อัปโหลดเอกสาร</div>
  <div class="header-sub">Vizzel Sales</div>
</div>

<div id="main">
  <div class="card">
    <div class="lbl">ประเภทเอกสาร</div>
    <div id="doc-type-display"
         style="padding:14px;background:#F5F3FF;border-radius:8px;font-size:15px;color:var(--vi-purple-dark);font-weight:700">
      กำลังโหลด...
    </div>
  </div>

  <div class="card">
    <div class="lbl">ไฟล์เอกสาร * — PDF, Word, Excel</div>
    <div class="file-wrap">
      <label class="file-btn" id="file-btn" for="file-inp">📎 เลือกไฟล์</label>
      <input type="file" id="file-inp" class="file-inp" accept=".pdf,.doc,.docx,.xls,.xlsx"
             onchange="onFileChosen(this)">
    </div>
    <div id="file-meta" class="file-meta" style="display:none"></div>
  </div>

  <button class="btn" id="submit-btn" onclick="doUpload()">อัปโหลด</button>
  <div id="msg" class="msg" style="display:none"></div>
</div>

<script>
const FRONTEND_BASE_URL = "https://vizzelintel.github.io/vizzel-sales-frontend/";
const API               = "https://vizzel-sales-api.fly.dev";
const API_BASE          = API + "/api/v1";
const params            = new URLSearchParams(location.search);
const PROJECT_ID        = params.get("project_id") || "";
const TOKEN             = params.get("token")      || "";

// Maps any Thai label (from old links) to the canonical English doc_type value
const DOC_TYPE_MAP = {
  'ใบเสนอราคา':                          'quotation_support',
  'ส่งใบเสนอราคา':                        'quotation_support',
  'ร่าง TOR':                            'tor_support',
  'ส่งร่าง TOR':                          'tor_support',
  'สัญญา':                               'contract',
  'เอกสารสัญญา':                          'contract',
  'แนบเอกสารสัญญาจัดซื้อจัดจ้าง':        'contract',
  'ปิดงาน':                              'closing',
  'เอกสารปิดงาน':                         'closing',
  'แนบเอกสารปิดงานและตรวจนับสินทรัพย์':  'closing',
  'quotation':    'quotation_support',
  'tor':          'tor_support',
};

const DOC_TYPE_LABELS = {
  'quotation_support': 'ใบเสนอราคา (Support)',
  'quotation_dealer':  'ใบเสนอราคา (Dealer)',
  'tor_support':       'ร่าง TOR (Support)',
  'tor_dealer':        'ร่าง TOR (Dealer)',
  'contract':          'เอกสารสัญญา',
  'closing':           'เอกสารปิดงาน',
  'site_survey':       'เอกสาร Site Survey',
  'attachment':        'เอกสารประกอบ',
  'เอกสารประกอบ':      'attachment',
};

const rawDocType = params.get("doc_type") || "";
const docType    = DOC_TYPE_MAP[rawDocType] || rawDocType;
const docLabel   = DOC_TYPE_LABELS[docType] || '';

if (!PROJECT_ID || !TOKEN) {
  document.getElementById("main").innerHTML =
    `<div class="err-banner">⚠️ ลิงก์ไม่ถูกต้อง<br>กรุณากลับไปที่แอป Vizzel Sales แล้วลองใหม่</div>`;
} else if (!docLabel) {
  document.getElementById("main").innerHTML =
    `<div class="err-banner">⚠️ ไม่พบประเภทเอกสาร<br>กรุณากลับไปที่แอปและลองใหม่</div>`;
} else {
  document.getElementById("doc-type-display").textContent = '📄 ' + docLabel;
}

let selectedFile = null;

function onFileChosen(input) {
  const file = input.files[0];
  if (!file) return;

  const ext = file.name.split(".").pop().toLowerCase();
  if (!["pdf","doc","docx","xls","xlsx"].includes(ext)) {
    showMsg("รองรับเฉพาะไฟล์ PDF, Word และ Excel เท่านั้น", false);
    input.value = "";
    return;
  }

  selectedFile = file;

  const btn = document.getElementById("file-btn");
  btn.classList.add("has-file");
  btn.textContent = "✓ " + file.name;

  const meta = document.getElementById("file-meta");
  meta.textContent = fmtSize(file.size);
  meta.style.display = "block";
}

async function doUpload() {
  if (!docType)      { showMsg("ไม่พบประเภทเอกสาร กรุณากลับไปที่แอปและลองใหม่", false); return; }
  if (!selectedFile) { showMsg("กรุณาเลือกไฟล์", false); return; }

  const btn = document.getElementById("submit-btn");
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>กำลังอัปโหลด...';

  const fd = new FormData();
  fd.append("project_id", PROJECT_ID);
  fd.append("doc_type",   docType);
  fd.append("file",       selectedFile);

  try {
    const res  = await fetch(`${API_BASE}/documents`, {
      method:  "POST",
      headers: { Authorization: "Bearer " + TOKEN },
      body:    fd,
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "upload failed");

    btn.style.display = "none";
    showMsg("อัปโหลดสำเร็จ ✓\n\nกำลังปิดหน้านี้และกลับไปที่แอป...", true);

    if (window.opener && !window.opener.closed) {
      try {
        window.opener.postMessage({
          type:      'UPLOAD_SUCCESS',
          projectId: PROJECT_ID,
          docType:   docType,
        }, '*');
      } catch(e) {}
      await new Promise(r => setTimeout(r, 500));
      window.close();
    } else {
      setTimeout(() => {
        window.location.href = FRONTEND_BASE_URL;
      }, 1500);
    }
  } catch(e) {
    btn.disabled = false;
    btn.textContent = "อัปโหลด";
    showMsg("อัปโหลดไม่สำเร็จ: " + e.message, false);
  }
}

function showMsg(text, ok) {
  const el = document.getElementById("msg");
  el.textContent   = text;
  el.className     = "msg " + (ok ? "msg-ok" : "msg-err");
  el.style.display = "block";
  el.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function fmtSize(bytes) {
  if (!bytes)          return "";
  if (bytes < 1024)    return bytes + " B";
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + " KB";
  return (bytes / 1048576).toFixed(1) + " MB";
}
</script>
</body>
</html>
